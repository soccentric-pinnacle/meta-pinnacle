BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-pinnacle"
BBFILE_PATTERN_meta-pinnacle = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pinnacle = "10"

LAYERDEPENDS_meta-pinnacle = "core freescale-layer"
LAYERSERIES_COMPAT_meta-pinnacle = "scarthgap walnascar"

# meta-imx's stmm-imx (StandAloneMM) recipe requires edk2-firmware_202508.bb
# which is not present in the pinned meta-arm revision. It is not needed for
# the Pinnacle image, so mask it to avoid a parse error.
BBMASK += "meta-imx/meta-imx-sdk/dynamic-layers/meta-arm/recipes-security/stmm-imx/stmm-imx_git.bb"

# meta-imx whinlatter 6.18.2 ships bbappends for newer recipe versions than the
# pinned poky/meta-openembedded provide (openssl 3.5, ethtool 6.15,
# vulkan-loader 1.4.328.1, opengl-es-cts 3.2.13.0). Mask them to avoid
# "No recipes in default available for" parse errors.
# meta-imx's bluez5 patches apply with fuzz against the pinned poky bluez5
# source. Treat fuzz as a warning rather than a fatal QA error.
ERROR_QA:remove = "patch-fuzz"

BBMASK += " \
    meta-imx/meta-imx-bsp/recipes-connectivity/openssl/openssl_3.5.%.bbappend \
    meta-imx/meta-imx-bsp/recipes-extended/ethtool/ethtool_6.15.bbappend \
    meta-imx/meta-imx-bsp/recipes-graphics/vulkan/vulkan-loader_1.4.328.1.bbappend \
    meta-imx/meta-imx-sdk/dynamic-layers/openembedded-layer/recipes-graphics/vk-gl-cts/opengl-es-cts_3.2.13.0.bbappend \
"
