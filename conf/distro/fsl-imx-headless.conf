# Pinnacle headless distro for NXP i.MX — no graphical stack

include conf/distro/include/fsl-imx-base.inc

DISTRO = "fsl-imx-headless"
DISTRO_NAME = "Pinnacle NXP Headless"

# Remove all graphical backends
DISTRO_FEATURES:remove = "directfb wayland x11 opengl vulkan qt"
DISTRO_FEATURES:append = " pam systemd"
